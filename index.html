<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI로 찾는 나의 포켓몬 짝꿍 ⚡️</title>
    
    <style>
        :root {
            --bg-main: #FFFDF0;
            --bg-card: #FFF8E1;
            --bg-card-hover: #FFF0B5;
            --accent-yellow: #FFE082;
            --accent-orange: #FFA000;
            --accent-dark-orange: #E65100;
            --text-primary: #3E2723;
            --text-secondary: #6D4C41;
            --white: #FFFFFF;
            --shadow-soft: 0 10px 25px rgba(230, 160, 40, 0.15);
            --shadow-button: 0 4px 12px rgba(255, 160, 0, 0.25);
            --radius-large: 28px;
            --radius-medium: 18px;
            --radius-small: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        .badge {
            display: inline-block;
            background-color: var(--accent-yellow);
            color: var(--accent-dark-orange);
            font-weight: 700;
            font-size: 0.95rem;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(255, 200, 0, 0.2);
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
            word-break: keep-all;
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            word-break: keep-all;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        @media (max-width: 480px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            h1 {
                font-size: 1.65rem;
            }
        }

        .mbti-btn {
            background: var(--white);
            border: 2px solid var(--accent-yellow);
            border-radius: var(--radius-medium);
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            user-select: none;
        }

        .mbti-btn:hover {
            transform: translateY(-4px);
            background-color: var(--bg-card-hover);
            border-color: var(--accent-orange);
            box-shadow: var(--shadow-button);
        }

        .mbti-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .mbti-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--accent-dark-orange);
            display: block;
        }

        .mbti-desc {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 2px;
            display: block;
        }

        .loading-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .pokeball {
            font-size: 4rem;
            display: inline-block;
            animation: shake 0.8s infinite ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg) scale(1); }
            20% { transform: rotate(-15deg) scale(1.1); }
            40% { transform: rotate(15deg) scale(1.1); }
            60% { transform: rotate(-10deg) scale(1.05); }
            80% { transform: rotate(10deg) scale(1.05); }
        }

        .loading-text {
            margin-top: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .result-screen {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .result-screen.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .result-card {
            background: var(--white);
            border-radius: var(--radius-large);
            padding: 32px 24px;
            box-shadow: var(--shadow-soft);
            border: 3px solid var(--accent-yellow);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .mbti-tag {
            display: inline-block;
            background-color: var(--accent-orange);
            color: var(--white);
            font-weight: 800;
            font-size: 1.1rem;
            padding: 6px 20px;
            border-radius: 30px;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .pokemon-emoji {
            font-size: 6rem;
            line-height: 1.1;
            margin: 12px 0;
            display: inline-block;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.1));
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .pokemon-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .pokemon-subtitle {
            font-size: 1rem;
            color: var(--accent-dark-orange);
            font-weight: 700;
            margin-bottom: 20px;
        }

        .reason-box {
            background-color: var(--bg-card);
            border-radius: var(--radius-medium);
            padding: 20px;
            text-align: left;
            margin-bottom: 24px;
            border-left: 5px solid var(--accent-orange);
        }

        .reason-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reason-text {
            font-size: 1.05rem;
            color: var(--text-primary);
            word-break: keep-all;
            line-height: 1.65;
        }

        .match-box {
            background-color: #FFFDF0;
            border: 2px dashed var(--accent-yellow);
            border-radius: var(--radius-medium);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .match-info {
            text-align: left;
        }

        .match-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-dark-orange);
        }

        .match-pokemon {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .match-emoji {
            font-size: 2.2rem;
        }

        .btn-reset {
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-dark-orange));
            color: var(--white);
            border: none;
            border-radius: var(--radius-medium);
            padding: 16px 36px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow-button);
            transition: all 0.25s ease;
            width: 100%;
            max-width: 280px;
            display: inline-block;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(230, 81, 0, 0.35);
        }

        .btn-reset:active {
            transform: translateY(1px);
        }

        footer {
            margin-top: 36px;
            text-align: center;
            font-size: 0.85rem;
            color: #A1887F;
        }
    </style>
</head>

            "ISTJ": "현실적·책임감", "ISFJ": "헌신적·온화함", "INFJ": "통찰력·다정함", "INTJ": "전략적·독창적",
            "ISTP": "만능·상황적응", "ISFP": "감성적·자유인", "INFP": "이상적·다재다능", "INTP": "아이디어·탐구",
            "ESTP": "모험가·행동파", "ESFP": "사교적·밝은빛", "ENFP": "열정적·호기심", "ENTP": "재치·아이디어",
            "ESTJ": "리더십·체계적", "ESFJ": "친절·분위기메이커", "ENFJ": "카리스마·따스함", "ENTJ": "도전적·개척자"
        };

        function initGrid() {
            const grid = document.getElementById('mbtiGrid');
            grid.innerHTML = '';

            mbtiList.forEach(mbti => {
                const btn = document.createElement('div');
                btn.className = 'mbti-btn';
                btn.onclick = () => selectMbti(mbti);

                btn.innerHTML = `
                    <span class="mbti-name">${mbti}</span>
                    <span class="mbti-desc">${mbtiDescs[mbti]}</span>
                `;
                grid.appendChild(btn);
            });
        }

        function selectMbti(mbti) {
            const data = pokemonData[mbti];
            if (!data) return;

            // 화면 전환
            document.getElementById('selectionScreen').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'none';
            document.getElementById('loadingScreen').style.display = 'block';

            // 0.6초 귀여운 로딩 연출
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';

                // 결과 세팅
                document.getElementById('resMbti').textContent = mbti;
                document.getElementById('resEmoji').textContent = data.emoji;
                document.getElementById('resName').textContent = data.name;
                document.getElementById('resTitle').textContent = data.title;
                document.getElementById('resReason').textContent = data.reason;

                document.getElementById('resMatchName').textContent = data.matchName;
                document.getElementById('resMatchEmoji').textContent = data.matchEmoji;

                const resultScreen = document.getElementById('resultScreen');
                resultScreen.classList.add('active');

                // 스크롤 맨 위로
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 600);
        }

        function resetSelection() {
            const resultScreen = document.getElementById('resultScreen');
            resultScreen.classList.remove('active');

            setTimeout(() => {
                document.getElementById('selectionScreen').style.display = 'block';
                document.getElementById('mainHeader').style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 200);
        }

        // 페이지 로드 시 실행
        window.onload = function() {
            initGrid();
        };
    </script>
</body>
</html>
